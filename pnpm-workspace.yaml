packages:
  - "apps/*"
  - "packages/*"
# Supply-chain hygiene: only install versions published at least 14 days ago...
minimumReleaseAge: 20160
# ...except security patches for published advisories (pnpm audit), pinned below.
minimumReleaseAgeExclude:
  - next@16.4.2
  - "@next/env@16.4.2"
  - "@next/swc-darwin-x64@16.4.2"
  - "@next/swc-darwin-arm64@16.4.2"
  - "@next/swc-linux-x64-gnu@16.4.2"
  - "@next/swc-linux-x64-musl@16.4.2"
  - "@next/swc-win32-x64-msvc@16.4.2"
  - "@next/swc-linux-arm64-gnu@16.4.2"
  - "@next/swc-linux-arm64-musl@16.4.2"
  - "@next/swc-win32-arm64-msvc@16.4.2"
  - zod@4.6.7
  - undici@7.30.1
overrides:
  undici: 7.30.1
# Native build scripts are opt-in.
allowBuilds:
  better-sqlite3: true
